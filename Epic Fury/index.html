<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lukash Wear</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"/>
</head>
<body>
   <header>
    <a href="#" class="logo">Lukash Wear</a>
    <div id="cart-icon">
        <img src="Cart--Streamline-Kameleon.svg">
        <span class="cart-item-count"></span>
    </div>
   </header>

   <div class="cart">
    <h2 class="cart-title">Your Cart</h2>
    <div class="cart-content">
        <div class="cart-box">
            <img src="product1.jpg" class="cart-img">
            <div class="cart-detail">
                <h2 class="cart-product-title">Casual Black</h2>
                <span class="cart-price">1000</span>
                <div class="cart-quantity">
                    <button id="decrement">-</button>
                    <span class="number">1</span>
                    <button id="increment">+</button>
                </div>
            </div>
           
           <img src="delete-bin-6-line.png"> 
        </div>
    </div>

    <div class="total">
        <div class="total-title">Total</div>
        <div class="total-price">ksh</div>
    </div>
    <button class="btn-buy">Buy Now</button>
    <img src="close-large-line.png" id="cart-close">
   </div>

   <section class="shop">
    <h1 class="section-title">Shop Products</h1>
    <div class="product-content">
        <div class="product-box">
            <div class="img-box">
                <img src="product1.jpg">
            </div>
            <h2 class="product-title">Casual black polo</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="product2.jpg">
            </div>
            <h2 class="product-title">Water proof Jacket</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="product3.jpg">
            </div>
            <h2 class="product-title">Blue swaet shirt</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="product4.jpg">
            </div>
            <h2 class="product-title">Hooded Jacket</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="product5.jpg">
            </div>
            <h2 class="product-title">Cold Weather Jacket</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>


        <div class="product-box">
            <div class="img-box">
                <img src="product6.jpg">
            </div>
            <h2 class="product-title">Sporty Jacket</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>

        <div class="product-box">
            <div class="img-box">
                <img src="product7.jpg">
            </div>
            <h2 class="product-title">Olive Hoodie</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>

        <div class="product-box">
            <div class="img-box">
                <img src="product8.jpg">
            </div>
            <h2 class="product-title">Polo</h2>
            <div class="price-and-cart">
                <span class="price">1000</span>
                <img src="Shopping-Cart-2--Streamline-Core.png">
            </div>
        </div>
    </div>
   </section>
   <script src="app.js"></script>
</body>
</html>
